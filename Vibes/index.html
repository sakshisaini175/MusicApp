<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vibes - Free Music Player</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<script>
  // Disable right-click context menu
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // Disable keyboard inspect shortcuts (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
  document.addEventListener('keydown', (e) => {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
      (e.ctrlKey && e.key === 'u')
    ) {
      e.preventDefault();
      return false;
    }
  });
</script>
<!-- Vercel Web Analytics Initialization Queue -->
<script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<!-- Vercel Web Analytics Tag -->
<script defer src="/_vercel/insights/script.js"></script>
<body class="bg-slate-900 text-white h-screen flex flex-col overflow-hidden">

  <!-- App Shell: everything centers on a fixed-width column so layout is identical in shape on every device -->
  <div class="app-shell">

    <!-- Header -->
    <header class="app-pad pt-4 pb-2 flex justify-between items-center gap-3 shrink-0">
      <div class="min-w-0">
        <h1 class="font-sync text-2xl sm:text-3xl leading-tight">🎶 Vibes</h1>
        <p class="text-slate-400 text-[11px] sm:text-sm truncate">Listen to free Hindi & Punjabi tracks</p>
      </div>
      <p class="text-[11px] sm:text-sm text-slate-400 shrink-0 whitespace-nowrap">Listening Now: <span id="user-count" class="text-cyan-400 font-semibold">0</span></p>
    </header>

    <!-- Top Display Banner -->
    <div id="ad-banner-top" class="app-pad my-2 shrink-0">
      <div class="p-2 bg-slate-800/50 border border-slate-700/50 rounded-xl text-center text-xs text-slate-500 min-h-[60px] flex items-center justify-center">
        <span>Advertisement</span>
      </div>
    </div>

    <!-- Category Cards -->
    <div id="category-cards" class="category-grid app-pad shrink-0"></div>

    <!-- Search + Favorites -->
    <div class="app-pad py-3 flex flex-nowrap gap-2 shrink-0">
      <input id="search-input" type="text" placeholder="Search songs..."
             class="min-w-0 flex-1 border border-slate-700 px-3 py-2 rounded-lg bg-slate-800 text-white text-sm focus:outline-none focus:border-cyan-400">
      <button id="search-btn" class="shrink-0 bg-cyan-500 px-3 sm:px-4 py-2 rounded-lg text-black font-bold text-sm hover:bg-cyan-400">Search</button>
      <button id="favorites-btn" class="shrink-0 bg-pink-500 px-3 sm:px-4 py-2 rounded-lg text-black font-bold text-sm hover:bg-pink-400 whitespace-nowrap">❤<span class="fav-label"> Favorites</span></button>
    </div>

    <span id="song-count-badge" class="app-pad text-xs text-slate-400 shrink-0 block pb-1">0 Songs Loaded</span>

    <!-- Playlist -->
    <div id="song-list-container" class="custom-scrollbar flex-1 overflow-y-auto app-pad pb-32 sm:pb-28">
      <div id="song-list" class="flex flex-col gap-2"></div>
    </div>
  </div>

  <!-- Footer Player -->
  <footer class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur border-t border-slate-700 px-3 py-2 z-50 footer-ios-fix">
    <div class="app-shell-inner mx-auto flex items-center justify-between gap-3 w-full">

      <!-- Track Details -->
      <div class="flex items-center min-w-0 flex-1">
        <div class="truncate">
          <h3 id="player-title" class="font-bold text-xs sm:text-sm md:text-base text-cyan-400 truncate">No song playing</h3>
          <p id="player-artist" class="text-[10px] sm:text-xs text-slate-400 truncate">---</p>
        </div>
        <div class="equalizer ml-2 shrink-0 flex" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- Controls + Audio -->
      <div class="player-controls flex items-center gap-1 flex-nowrap justify-end shrink-0 min-w-0">
        <div class="flex items-center gap-1 shrink-0">
          <button id="prev-btn" class="control-btn bg-slate-700 px-2 py-1 rounded text-xs hover:bg-slate-600 active:scale-95">⏮</button>
          <button id="shuffle-btn" class="control-btn bg-slate-700 px-2 py-1 rounded text-xs hover:bg-slate-600 active:scale-95">🔀</button>
          <button id="repeat-btn" class="control-btn bg-slate-700 px-2 py-1 rounded text-xs hover:bg-slate-600 active:scale-95">🔁</button>
          <button id="next-btn" class="control-btn bg-slate-700 px-2 py-1 rounded text-xs hover:bg-slate-600 active:scale-95">⏭</button>
        </div>
        <audio id="audio-element" controls class="min-w-0 shrink"></audio>
      </div>
    </div>
  </footer>

  <script src="js/playlist.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
