<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vibes - Free Music Player</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<script>
  // Disable right-click context menu
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // Disable keyboard inspect shortcuts (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
  document.addEventListener('keydown', (e) => {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
      (e.ctrlKey && e.key === 'u')
    ) {
      e.preventDefault();
      return false;
    }
  });
</script>
<!-- Vercel Web Analytics Initialization Queue -->
<script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<!-- Vercel Web Analytics Tag -->
<script defer src="/_vercel/insights/script.js"></script>
<body class="bg-gradient-to-b from-[#0b061d] via-[#150b36] to-[#080214] text-white min-h-screen flex flex-col font-sans">

  <!-- App Shell -->
  <div class="app-shell flex-1 flex flex-col min-h-screen relative">

    <!-- Header Navigation -->
<!-- Unified Responsive Header Navigation -->
  <header class="sticky top-0 z-30 header-ios-fix border-b border-white/5 bg-[#0b061d]/90 backdrop-blur-md">
    <div class="app-shell-inner mx-auto app-pad py-2 sm:py-3 flex flex-col md:flex-row md:items-center justify-between gap-2.5 sm:gap-4">
      
      <!-- Top Row on Mobile / Left Column on Desktop -->
      <div class="flex items-center justify-between w-full md:w-auto shrink-0 gap-3">
        <!-- Brand Logo -->
        <h1 class="font-sync text-xl sm:text-2xl md:text-3xl font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent shrink-0">
          Vibes
        </h1>

        <!-- Search & Heart Icon (Mobile Top Right) -->
        <div class="flex md:hidden items-center gap-2 flex-1 max-w-[200px] justify-end min-w-0">
          <div class="relative flex items-center w-full">
            <input id="search-input-mobile" type="text" placeholder="Search..."
                   class="w-full bg-white/10 border border-white/10 pl-7 pr-2.5 py-1 rounded-full text-xs text-white placeholder-slate-400 focus:outline-none focus:border-cyan-400 transition truncate">
            <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 pointer-events-none"></i>
          </div>
          
          <button id="favorites-btn-mobile" class="flex items-center justify-center w-7 h-7 rounded-full bg-pink-500/20 text-pink-400 hover:bg-pink-500/30 transition shrink-0" title="Favorites">
            <i data-lucide="heart" class="w-3.5 h-3.5 fill-current"></i>
          </button>
        </div>
      </div>

      <!-- Horizontal Navigation Links (Same Menu for Mobile & Desktop) -->
      <nav class="flex items-center gap-4 sm:gap-6 overflow-x-auto no-scrollbar text-xs sm:text-sm font-medium text-slate-300 py-0.5 whitespace-nowrap">
        <button id="nav-home" class="nav-link text-white font-semibold border-b-2 border-cyan-400 pb-0.5 shrink-0">Home</button>
        <button id="nav-trending" class="nav-link hover:text-white transition shrink-0">Trending</button>
        <button id="nav-favorites" class="nav-link hover:text-white transition shrink-0">Favorites</button>
        <button id="nav-playlist" class="nav-link hover:text-white transition shrink-0">My Playlist</button>
      </nav>

      <!-- Desktop Search Bar (Visible on Laptops / Tablets) -->
      <div class="hidden md:flex items-center gap-3 shrink-0">
        <div id="search-container" class="relative flex items-center">
          <input id="search-input" type="text" placeholder="Search songs..."
                 class="w-44 lg:w-56 bg-white/10 border border-white/10 pl-7 pr-3 py-1.5 rounded-full text-xs text-white placeholder-slate-400 focus:outline-none focus:border-cyan-400 transition">
          <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 pointer-events-none"></i>
        </div>
      </div>

    </div>
  </header>

    <!-- Content Area -->
    <main class="flex-1 app-pad py-4" id="song-list-container">
      
      <!-- Category Icon Cards -->
      <section class="mb-6">
        <div id="category-cards" class="grid grid-cols-5 gap-2 sm:gap-4"></div>
      </section>

      <!-- Section Title & Status -->
      <div class="flex justify-between items-center mb-3">
        <h2 id="section-title" class="text-base sm:text-lg font-bold text-white tracking-wide">Trending Songs</h2>
        
        <div class="flex items-center gap-2 sm:gap-3">
          <!-- Live Listeners Counter Badge -->
          <div id="live-listeners-badge" class="flex items-center gap-1.5 text-[11px] font-medium text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded-full border border-emerald-500/20">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="live-listeners-count">1,248</span>
            <span class="text-slate-400 font-normal hidden sm:inline">listening live</span>
          </div>

          <!-- Song Count Badge -->
          <span id="song-count-badge" class="text-xs text-slate-400">0 Songs Loaded</span>
        </div>
      </div>
      
      <!-- Song List + Spacer for Floating Bar Clearance -->
      <div id="song-list" class="flex flex-col gap-2"></div>
      
      <!-- Clearance spacer forces bottom items up past floating player -->
      <div class="h-44 w-full shrink-0" aria-hidden="true"></div>

    </main>

  </div>


  <!-- Bottom Floating Player Bar -->
  <footer class="fixed bottom-9 left-0 right-0 z-40 app-pad footer-ios-fix pointer-events-none">
    <div class="app-shell-inner mx-auto pointer-events-auto">
      <div class="bg-gradient-to-r from-[#1a0e3b]/95 via-[#23124d]/95 to-[#160b33]/95 backdrop-blur-xl border border-white/10 rounded-2xl p-2.5 sm:p-3 shadow-2xl flex flex-col sm:flex-row items-center justify-between gap-2 sm:gap-3">

        <!-- Top/Left Track Info & Right Quick Actions in Mobile Row -->
        <div class="flex items-center justify-between w-full sm:w-1/3 min-w-0">
          <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <div class="relative w-9 h-9 sm:w-11 sm:h-11 rounded-xl overflow-hidden shrink-0 bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-md">
              <i data-lucide="music" class="w-5 h-5 sm:w-6 sm:h-6 text-white"></i>
              <div class="equalizer absolute inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center gap-0.5" id="player-equalizer" style="display:none;">
                <span class="w-1 bg-cyan-400 rounded-full"></span>
                <span class="w-1 bg-cyan-400 rounded-full"></span>
                <span class="w-1 bg-cyan-400 rounded-full"></span>
              </div>
            </div>
            <div class="truncate">
              <h3 id="player-title" class="font-bold text-xs sm:text-sm text-white truncate">No song playing</h3>
              <p id="player-artist" class="text-[10px] sm:text-[11px] text-slate-400 truncate">Select a track to play</p>
            </div>
          </div>

          <!-- Quick Action Buttons for Mobile Portrait -->
          <div class="flex sm:hidden items-center gap-1 shrink-0 ml-2">
            <button id="player-fav-btn-mobile" class="text-slate-400 hover:text-pink-500 transition p-1.5" title="Favorite">
              <i data-lucide="heart" class="w-4 h-4"></i>
            </button>
            <button id="player-menu-btn-mobile" class="text-slate-400 hover:text-white transition p-1.5" aria-label="More options">
              <i data-lucide="more-vertical" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Center Controls + Progress Bar -->
        <div class="flex flex-col items-center gap-1 w-full sm:w-1/2 min-w-0">
          
          <div class="flex items-center gap-3 sm:gap-4">
            <button id="repeat-btn" class="text-slate-400 hover:text-white transition text-xs" title="Repeat">
              <i data-lucide="repeat" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            </button>
            <button id="prev-btn" class="text-slate-300 hover:text-white transition active:scale-90" title="Previous">
              <i data-lucide="skip-back" class="w-4 h-4 sm:w-5 sm:h-5 fill-current"></i>
            </button>
            <button id="play-pause-btn" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white text-black flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition">
              <i data-lucide="play" id="play-pause-icon" class="w-3.5 h-3.5 sm:w-4 sm:h-4 fill-current ml-0.5"></i>
            </button>
            <button id="next-btn" class="text-slate-300 hover:text-white transition active:scale-90" title="Next">
              <i data-lucide="skip-forward" class="w-4 h-4 sm:w-5 sm:h-5 fill-current"></i>
            </button>
            <button id="shuffle-btn" class="text-slate-400 hover:text-white transition text-xs" title="Shuffle">
              <i data-lucide="shuffle" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            </button>
          </div>

          <div class="flex items-center gap-2 w-full max-w-md">
            <span id="current-time" class="text-[10px] text-slate-400 tabular-nums shrink-0">0:00</span>
            <input id="seek-bar" type="range" min="0" max="100" value="0" step="0.1" class="seek-bar flex-1">
            <span id="duration-time" class="text-[10px] text-slate-400 tabular-nums shrink-0">0:00</span>
          </div>

        </div>

        <!-- Right Menu Options (Desktop Landscape) -->
        <div class="hidden sm:flex items-center justify-end gap-2 w-1/6 relative">
          <button id="player-fav-btn" class="text-slate-400 hover:text-pink-500 transition p-1" title="Favorite">
            <i data-lucide="heart" class="w-4 h-4"></i>
          </button>
          
          <button id="player-menu-btn" class="text-slate-400 hover:text-white transition p-1" aria-label="More options">
            <i data-lucide="more-vertical" class="w-4 h-4"></i>
          </button>

          <!-- Dropdown Menu -->
          <div id="player-menu-panel" class="player-menu-panel hidden absolute bottom-full right-0 mb-2 w-44 bg-[#0f0728] border border-white/10 rounded-xl p-2 shadow-2xl z-50">
            <button id="download-btn" class="player-menu-item flex items-center gap-2 w-full text-left px-2 py-1.5 text-xs text-slate-300 hover:bg-white/10 rounded-lg">
              <i data-lucide="download" class="w-3.5 h-3.5"></i> Download track
            </button>
            <div class="h-px bg-white/10 my-1"></div>
            <p class="text-[10px] uppercase text-slate-500 font-bold px-2 mb-1">Playback speed</p>
            <div id="speed-options" class="grid grid-cols-3 gap-1">
              <button class="speed-btn text-[10px] py-1 rounded bg-white/5 hover:bg-white/15 text-slate-300 font-bold" data-speed="0.5">0.5x</button>
              <button class="speed-btn text-[10px] py-1 rounded bg-white/5 hover:bg-white/15 text-slate-300 font-bold" data-speed="0.75">0.75x</button>
              <button class="speed-btn speed-active text-[10px] py-1 rounded bg-cyan-400 text-black font-bold" data-speed="1">1x</button>
              <button class="speed-btn text-[10px] py-1 rounded bg-white/5 hover:bg-white/15 text-slate-300 font-bold" data-speed="1.25">1.25x</button>
              <button class="speed-btn text-[10px] py-1 rounded bg-white/5 hover:bg-white/15 text-slate-300 font-bold" data-speed="1.5">1.5x</button>
              <button class="speed-btn text-[10px] py-1 rounded bg-white/5 hover:bg-white/15 text-slate-300 font-bold" data-speed="2">2x</button>
            </div>
          </div>
        </div>

      </div>
    </div>
    <audio id="audio-element" class="sr-only"></audio>
  </footer>

  <!-- Ad Banner Bottom Bar -->
  <div id="ad-banner-bottom" class="fixed bottom-0 left-0 right-0 bg-[#070314] border-t border-white/10 py-1.5 px-4 z-30 flex items-center justify-between text-xs text-slate-400">
    <div class="app-shell-inner mx-auto flex items-center justify-between w-full">
      <span class="truncate">Your Ad Here - Promote Your Brand!</span>
      <button onclick="document.getElementById('ad-banner-bottom').style.display='none'" class="text-slate-500 hover:text-white p-0.5">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <script src="js/playlist.js"></script>
  <script src="js/app.js"></script>
  <script>
    lucide.createIcons();

    (function () {
      const audio = document.getElementById('audio-element');
      const playPauseBtn = document.getElementById('play-pause-btn');
      const seekBar = document.getElementById('seek-bar');
      const currentTimeEl = document.getElementById('current-time');
      const durationEl = document.getElementById('duration-time');
      if (!audio || !playPauseBtn || !seekBar) return;

      let isScrubbing = false;

      function formatTime(sec) {
        if (!isFinite(sec) || isNaN(sec) || sec < 0) return '0:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }

      function updatePlayIcon() {
        const iconContainer = document.getElementById('play-pause-icon');
        if (iconContainer) {
          iconContainer.setAttribute('data-lucide', audio.paused ? 'play' : 'pause');
          lucide.createIcons();
        }
      }

      playPauseBtn.addEventListener('click', () => {
        if (!audio.src) return;
        if (audio.paused) audio.play().catch(() => {});
        else audio.pause();
      });

      audio.addEventListener('play', updatePlayIcon);
      audio.addEventListener('pause', updatePlayIcon);
      audio.addEventListener('ended', updatePlayIcon);

      audio.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(audio.duration);
        seekBar.max = isFinite(audio.duration) ? audio.duration : 100;
      });

      audio.addEventListener('timeupdate', () => {
        if (isScrubbing) return;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        if (isFinite(audio.duration) && audio.duration > 0) {
          seekBar.value = audio.currentTime;
        }
      });

      seekBar.addEventListener('input', () => {
        isScrubbing = true;
        currentTimeEl.textContent = formatTime(Number(seekBar.value));
      });

      seekBar.addEventListener('change', () => {
        audio.currentTime = Number(seekBar.value);
        isScrubbing = false;
      });

      const menuBtn = document.getElementById('player-menu-btn');
      const menuBtnMobile = document.getElementById('player-menu-btn-mobile');
      const menuPanel = document.getElementById('player-menu-panel');
      const speedButtons = document.querySelectorAll('.speed-btn');
      const downloadBtn = document.getElementById('download-btn');

      if (menuBtn && menuPanel) {
        menuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          menuPanel.classList.toggle('hidden');
        });
        document.addEventListener('click', (e) => {
          if (!menuPanel.contains(e.target) && e.target !== menuBtn) {
            menuPanel.classList.add('hidden');
          }
        });
      }
     
      if (menuBtnMobile && menuPanel) {
        menuBtnMobile.addEventListener('click', (e) => {
          e.stopPropagation();
          menuPanel.classList.toggle('hidden');
        });
      }

      // Sync Mobile and Desktop Search Inputs
      const desktopSearch = document.getElementById('search-input');
      const mobileSearch = document.getElementById('search-input-mobile');

      if (mobileSearch && desktopSearch) {
        mobileSearch.addEventListener('input', (e) => {
          desktopSearch.value = e.target.value;
          desktopSearch.dispatchEvent(new Event('input'));
        });
      }
      
      speedButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const rate = parseFloat(btn.dataset.speed);
          audio.playbackRate = rate;
          speedButtons.forEach((b) => {
            b.classList.remove('bg-cyan-400', 'text-black');
            b.classList.add('bg-white/5', 'text-slate-300');
          });
          btn.classList.remove('bg-white/5', 'text-slate-300');
          btn.classList.add('bg-cyan-400', 'text-black');
          if (menuPanel) menuPanel.classList.add('hidden');
        });
      });

      if (downloadBtn) {
        downloadBtn.addEventListener('click', async () => {
          if (!audio.src) return;
          const titleEl = document.getElementById('player-title');
          const rawName = (titleEl && titleEl.innerText ? titleEl.innerText : 'vibes-track').trim();
          const safeName = rawName.replace(/[\\/:*?"<>|]+/g, '').slice(0, 80) || 'vibes-track';

          try {
            const res = await fetch(audio.src);
            const blob = await res.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = `${safeName}.mp3`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
          } catch (err) {
            window.open(audio.src, '_blank', 'noopener');
          }
          if (menuPanel) menuPanel.classList.add('hidden');
        });
      }
    })();
  </script>
</body>
</html>
