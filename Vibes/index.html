<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vibes - Free Music Player</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<script>
  // Disable right-click context menu
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // Disable keyboard inspect shortcuts (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
  document.addEventListener('keydown', (e) => {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
      (e.ctrlKey && e.key === 'u')
    ) {
      e.preventDefault();
      return false;
    }
  });
</script>
<!-- Vercel Web Analytics Initialization Queue -->
<script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<!-- Vercel Web Analytics Tag -->
<script defer src="/_vercel/insights/script.js"></script>
<body class="bg-slate-900 text-white h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="p-4 flex flex-wrap justify-between items-center shrink-0 gap-2">
    <div>
      <h1 class="font-sync text-3xl">🎶 Vibes</h1>
      <p class="text-slate-400 text-sm">Listen to free Hindi & Punjabi tracks</p>
    </div>
    <p class="text-xs text-slate-400">Listening Now: <span id="user-count">0</span></p>
  </header>

  <!-- Top Display Banner (Leaderboard 728x90) -->
  <div id="ad-banner-top" class="mx-4 my-2 p-2 bg-slate-800/50 border border-slate-700/50 rounded-xl text-center text-xs text-slate-500 shrink-0 min-h-[60px] flex items-center justify-center">
    <span>Advertisement</span>
  </div>

  <!-- Category Cards -->
  <div id="category-cards" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 p-4 shrink-0"></div>

  <!-- Search + Favorites -->
  <div class="p-4 flex flex-wrap gap-2 shrink-0">
    <input id="search-input" type="text" placeholder="Search songs..." 
           class="border border-slate-700 p-2 flex-grow rounded bg-slate-800 text-white focus:outline-none focus:border-cyan-400 min-w-[150px]">
    <button id="search-btn" class="bg-cyan-500 px-4 py-2 rounded text-black font-bold hover:bg-cyan-400">Search</button>
    <button id="favorites-btn" class="bg-pink-500 px-4 py-2 rounded text-black font-bold hover:bg-pink-400">❤ Favorites</button>
  </div>

  <span id="song-count-badge" class="px-4 text-xs text-slate-400 shrink-0">0 Songs Loaded</span>

  <!-- Playlist (Scrollable section filling remaining height) -->
  <div id="song-list-container" class="custom-scrollbar flex-1 overflow-y-auto p-4 pb-32 sm:pb-28">
    <div id="song-list" class="flex flex-col gap-2"></div>
  </div>

  <!-- Fixed Player Footer -->
  <footer class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur border-t border-slate-700 px-3 py-2 z-50 footer-ios-fix">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2 w-full">
      
      <!-- Track Details -->
      <div class="flex items-center min-w-0 flex-1">
        <div class="truncate">
          <h3 id="player-title" class="font-bold text-xs sm:text-sm md:text-base text-cyan-400 truncate">No song playing</h3>
          <p id="player-artist" class="text-[10px] sm:text-xs text-slate-400 truncate">---</p>
        </div>
        <!-- Equalizer -->
        <div class="equalizer ml-2 shrink-0 flex" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- Controls + Audio Player -->
      <div class="flex items-center gap-2 flex-wrap justify-end flex-1 min-w-0">
        <!-- Media Buttons -->
        <div class="flex items-center gap-1 shrink-0">
          <button id="prev-btn" class="control-btn bg-slate-700 px-2 py-1 rounded text-xs hover:bg-slate-600 active:scale-95" title="Previous">⏮</button>
          <button id="shuffle-btn" class="control-btn bg-slate-700 px-2 py-1 rounded text-xs hover:bg-slate-600 active:scale-95" title="Shuffle">🔀</button>
          <button id="repeat-btn" class="control-btn bg-slate-700 px-2 py-1 rounded text-xs hover:bg-slate-600 active:scale-95" title="Repeat">🔁</button>
          <button id="next-btn" class="control-btn bg-slate-700 px-2 py-1 rounded text-xs hover:bg-slate-600 active:scale-95" title="Next">⏭</button>
        </div>

        <!-- Audio Player -->
        <audio id="audio-element" controls class="w-full sm:w-64 md:w-96 h-8 rounded-lg shrink min-w-0"></audio>
      </div>
    </div>
  </footer>

  <script src="js/playlist.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
