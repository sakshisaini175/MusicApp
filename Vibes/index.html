<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vibes - Free Music Player</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="p-4 flex justify-between items-center shrink-0">
    <div>
      <h1 class="font-sync text-3xl">🎶 Vibes</h1>
      <p class="text-slate-400 text-sm">Listen to free Hindi & Punjabi tracks</p>
    </div>
    <p class="text-xs text-slate-400">Listening Now: <span id="user-count">0</span></p>
  </header>

<!-- Category Cards -->
<div id="category-cards" class="grid grid-cols-2 md:grid-cols-5 gap-3 p-4 shrink-0"></div>

  <!-- Search + Favorites -->
  <div class="p-4 flex gap-2 shrink-0">
    <input id="search-input" type="text" placeholder="Search songs..." 
           class="border border-slate-700 p-2 flex-grow rounded bg-slate-800 text-white focus:outline-none focus:border-cyan-400">
    <button id="search-btn" class="bg-cyan-500 px-4 py-2 rounded text-black font-bold hover:bg-cyan-400">Search</button>
    <button id="favorites-btn" class="bg-pink-500 px-4 py-2 rounded text-black font-bold hover:bg-pink-400">❤ Favorites</button>
  </div>

  <span id="song-count-badge" class="px-4 text-xs text-slate-400 shrink-0">0 Songs Loaded</span>

  <!-- Playlist (Scrollable section filling remaining height) -->
  <div id="song-list-container" class="custom-scrollbar flex-1 overflow-y-auto p-4 pb-28">
    <div id="song-list" class="flex flex-col gap-2"></div>
  </div>

  <!-- Fixed Player Footer -->
  <footer class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur border-t border-slate-700 p-4 shadow-lg z-50">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 max-w-7xl mx-auto">
      <div>
        <h3 id="player-title" class="font-bold text-sm md:text-base text-cyan-400">No song playing</h3>
        <p id="player-artist" class="text-xs text-slate-400">---</p>
      </div>

      <div class="flex items-center gap-3">
        <button id="prev-btn" class="bg-slate-700 px-3 py-1 rounded hover:bg-slate-600">⏮</button>
        <audio id="audio-element" controls class="w-64 md:w-96 rounded-lg h-10"></audio>
        <button id="next-btn" class="bg-slate-700 px-3 py-1 rounded hover:bg-slate-600">⏭</button>
      </div>
    </div>
  </footer>

  <script src="js/playlist.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
