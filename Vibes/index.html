<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vibes - Free Music Player</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<script>
  // Disable right-click context menu
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // Disable keyboard inspect shortcuts (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
  document.addEventListener('keydown', (e) => {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
      (e.ctrlKey && e.key === 'u')
    ) {
      e.preventDefault();
      return false;
    }
  });
</script>
<!-- Vercel Web Analytics Initialization Queue -->
<script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<!-- Vercel Web Analytics Tag -->
<script defer src="/_vercel/insights/script.js"></script>
<body class="bg-slate-900 text-white h-screen flex flex-col overflow-hidden">

  <!-- App Shell: everything centers on a fixed-width column so layout is identical in shape on every device -->
  <div class="app-shell">

    <!-- Header -->
    <header class="app-pad pt-4 pb-2 flex justify-between items-center gap-3 shrink-0">
      <div class="min-w-0">
        <h1 class="font-sync text-2xl sm:text-3xl leading-tight">🎶 Vibes</h1>
        <p class="text-slate-400 text-[11px] sm:text-sm truncate">Listen to free Hindi & Punjabi tracks</p>
      </div>
      <p class="text-[11px] sm:text-sm text-slate-400 shrink-0 whitespace-nowrap">Listening Now: <span id="user-count" class="text-cyan-400 font-semibold">0</span></p>
    </header>

    <!-- Top Display Banner -->
    <div id="ad-banner-top" class="app-pad my-2 shrink-0">
      <div class="p-2 bg-slate-800/50 border border-slate-700/50 rounded-xl text-center text-xs text-slate-500 min-h-[60px] flex items-center justify-center">
        <span>Advertisement</span>
      </div>
    </div>

    <!-- Category Cards -->
    <div id="category-cards" class="category-grid app-pad shrink-0"></div>

    <!-- Search + Favorites -->
    <div class="app-pad py-3 flex flex-nowrap gap-2 shrink-0">
      <input id="search-input" type="text" placeholder="Search songs..."
             class="min-w-0 flex-1 border border-slate-700 px-3 py-2 rounded-lg bg-slate-800 text-white text-sm focus:outline-none focus:border-cyan-400">
      <button id="search-btn" class="shrink-0 bg-cyan-500 px-3 sm:px-4 py-2 rounded-lg text-black font-bold text-sm hover:bg-cyan-400">Search</button>
      <button id="favorites-btn" class="shrink-0 bg-pink-500 px-3 sm:px-4 py-2 rounded-lg text-black font-bold text-sm hover:bg-pink-400 whitespace-nowrap">❤<span class="fav-label"> Favorites</span></button>
    </div>

    <span id="song-count-badge" class="app-pad text-xs text-slate-400 shrink-0 block pb-1">0 Songs Loaded</span>

    <!-- Playlist -->
    <div id="song-list-container" class="custom-scrollbar flex-1 overflow-y-auto app-pad pb-32 sm:pb-28">
      <div id="song-list" class="flex flex-col gap-2"></div>
    </div>
  </div>

  <!-- Footer Player -->
  <footer class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur border-t border-slate-700 px-3 py-2 z-50 footer-ios-fix">
    <div class="app-shell-inner mx-auto flex items-center justify-between gap-3 w-full">

      <!-- Track Details -->
      <div class="flex items-center min-w-0 flex-1">
        <div class="truncate">
          <h3 id="player-title" class="font-bold text-xs sm:text-sm md:text-base text-cyan-400 truncate">No song playing</h3>
          <p id="player-artist" class="text-[10px] sm:text-xs text-slate-400 truncate">---</p>
        </div>
        <div class="equalizer ml-2 shrink-0 flex" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- Controls + Audio -->
      <div class="player-controls flex items-center gap-1 flex-nowrap justify-end shrink-0 min-w-0">
        <div class="flex items-center gap-1 shrink-0">
          <button id="prev-btn" class="control-btn bg-slate-700 px-2 py-1 rounded text-xs hover:bg-slate-600 active:scale-95">⏮</button>
          <button id="shuffle-btn" class="control-btn bg-slate-700 px-2 py-1 rounded text-xs hover:bg-slate-600 active:scale-95">🔀</button>
          <button id="repeat-btn" class="control-btn bg-slate-700 px-2 py-1 rounded text-xs hover:bg-slate-600 active:scale-95">🔁</button>
          <button id="next-btn" class="control-btn bg-slate-700 px-2 py-1 rounded text-xs hover:bg-slate-600 active:scale-95">⏭</button>
        </div>

        <!-- Custom progress bar: replaces the native <audio controls> UI,
             which iOS Safari collapses to a bare play button below ~250px
             with no way to override it via CSS. This renders identically
             on every browser/device instead. -->
        <div id="custom-player-bar" class="flex items-center gap-1.5 shrink-0 relative">
          <button id="play-pause-btn" class="control-btn bg-cyan-500 text-black shrink-0 rounded hover:bg-cyan-400 active:scale-95" aria-label="Play or pause">
            <span id="play-pause-icon">▶</span>
          </button>
          <span id="current-time" class="time-label text-[10px] text-slate-400 shrink-0 tabular-nums">0:00</span>
          <input id="seek-bar" type="range" min="0" max="100" value="0" step="0.1"
                 class="seek-bar shrink-0" aria-label="Seek">
          <span id="duration-time" class="time-label text-[10px] text-slate-400 shrink-0 tabular-nums">0:00</span>

          <!-- Three-dot menu: download + playback speed -->
          <div class="relative shrink-0">
            <button id="player-menu-btn" class="control-btn bg-slate-700 rounded hover:bg-slate-600 active:scale-95" aria-haspopup="true" aria-expanded="false" aria-label="More player options">⋮</button>
            <div id="player-menu-panel" class="player-menu-panel hidden" role="menu">
              <button id="download-btn" class="player-menu-item" role="menuitem">⬇ Download track</button>
              <div class="player-menu-divider"></div>
              <p class="player-menu-label">Playback speed</p>
              <div id="speed-options" class="player-menu-speeds">
                <button class="speed-btn" data-speed="0.5" role="menuitemradio">0.5x</button>
                <button class="speed-btn" data-speed="0.75" role="menuitemradio">0.75x</button>
                <button class="speed-btn speed-active" data-speed="1" role="menuitemradio">1x</button>
                <button class="speed-btn" data-speed="1.25" role="menuitemradio">1.25x</button>
                <button class="speed-btn" data-speed="1.5" role="menuitemradio">1.5x</button>
                <button class="speed-btn" data-speed="2" role="menuitemradio">2x</button>
              </div>
            </div>
          </div>
        </div>

        <audio id="audio-element" class="sr-only"></audio>
      </div>
    </div>
  </footer>

  <script src="js/playlist.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Custom progress bar for #audio-element. Independent of app.js/playlist.js —
    // only reads/controls the audio element's standard playback API, so it
    // works no matter how those files load a track into it.
    (function () {
      const audio = document.getElementById('audio-element');
      const playPauseBtn = document.getElementById('play-pause-btn');
      const playPauseIcon = document.getElementById('play-pause-icon');
      const seekBar = document.getElementById('seek-bar');
      const currentTimeEl = document.getElementById('current-time');
      const durationEl = document.getElementById('duration-time');
      if (!audio || !playPauseBtn || !seekBar) return;

      let isScrubbing = false;

      function formatTime(sec) {
        if (!isFinite(sec) || isNaN(sec) || sec < 0) return '0:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }

      function updatePlayIcon() {
        playPauseIcon.textContent = audio.paused ? '▶' : '⏸';
        playPauseBtn.setAttribute('aria-label', audio.paused ? 'Play' : 'Pause');
      }

      playPauseBtn.addEventListener('click', () => {
        if (!audio.src) return;
        if (audio.paused) audio.play().catch(() => {});
        else audio.pause();
      });

      audio.addEventListener('play', updatePlayIcon);
      audio.addEventListener('pause', updatePlayIcon);
      audio.addEventListener('ended', updatePlayIcon);

      audio.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(audio.duration);
        seekBar.max = isFinite(audio.duration) ? audio.duration : 100;
      });

      audio.addEventListener('timeupdate', () => {
        if (isScrubbing) return;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        if (isFinite(audio.duration) && audio.duration > 0) {
          seekBar.value = audio.currentTime;
        }
      });

      seekBar.addEventListener('input', () => {
        isScrubbing = true;
        currentTimeEl.textContent = formatTime(Number(seekBar.value));
      });

      seekBar.addEventListener('change', () => {
        audio.currentTime = Number(seekBar.value);
        isScrubbing = false;
      });

      // Keep in sync if another script (app.js) starts playback on its own.
      updatePlayIcon();

      // --- Three-dot menu: playback speed + download -------------------
      const menuBtn = document.getElementById('player-menu-btn');
      const menuPanel = document.getElementById('player-menu-panel');
      const speedButtons = document.querySelectorAll('.speed-btn');
      const downloadBtn = document.getElementById('download-btn');

      function closeMenu() {
        menuPanel.classList.add('hidden');
        menuBtn.setAttribute('aria-expanded', 'false');
      }
      function openMenu() {
        menuPanel.classList.remove('hidden');
        menuBtn.setAttribute('aria-expanded', 'true');
      }

      if (menuBtn && menuPanel) {
        menuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          menuPanel.classList.contains('hidden') ? openMenu() : closeMenu();
        });
        document.addEventListener('click', (e) => {
          if (!menuPanel.classList.contains('hidden') && !menuPanel.contains(e.target) && e.target !== menuBtn) {
            closeMenu();
          }
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeMenu();
        });
      }

      speedButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const rate = parseFloat(btn.dataset.speed);
          audio.playbackRate = rate;
          speedButtons.forEach((b) => b.classList.remove('speed-active'));
          btn.classList.add('speed-active');
          closeMenu();
        });
      });

      if (downloadBtn) {
        downloadBtn.addEventListener('click', async () => {
          if (!audio.src) return;
          const titleEl = document.getElementById('player-title');
          const rawName = (titleEl && titleEl.innerText && titleEl.innerText !== 'Loading stream...' ? titleEl.innerText : 'vibes-track').trim();
          const safeName = rawName.replace(/[\\/:*?"<>|]+/g, '').slice(0, 80) || 'vibes-track';

          try {
            // Works when the source allows cross-origin fetch; produces a
            // real local download with the track's title as the filename.
            const res = await fetch(audio.src);
            const blob = await res.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = `${safeName}.mp3`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
          } catch (err) {
            // Cross-origin sources that block fetch: fall back to opening
            // the stream directly so the user can save it manually.
            console.warn('Direct download blocked, opening stream instead:', err);
            window.open(audio.src, '_blank', 'noopener');
          }
          closeMenu();
        });
      }
    })();
  </script>
</body>
</html>
